name: Secure DevSecOps to GCP VM (Kind Cluster)

on:
  push:
    branches:
      - main

jobs:
  # ------------------ STAGE 1: CI & SECURITY (वही पुरानी बेस्ट पाइपलाइन) ------------------
  ci-stage:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@v3
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      with:
        args: >
          -Dsonar.projectKey=my-app
          -Dsonar.sources=.

    - name: Trivy FS Security Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '1'
        severity: 'CRITICAL,HIGH'

    - name: Log in to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Load Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false 
        load: true  
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }}
          ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest

    - name: Trivy Image Security Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }}'
        format: 'table'
        exit-code: '1'
        severity: 'CRITICAL,HIGH'

    - name: Push Docker Image to DockerHub
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest

  # ------------------ STAGE 2: CD (DEPLOY TO GCP VM + KIND) ------------------
  cd-stage:
    runs-on: ubuntu-latest
    needs: ci-stage 

    steps:
    - name: Deploy to Kind Cluster via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          cd /home/sandeshsaini7983637650/new/two-tier-flask-app || cd /root/new/two-tier-flask-app
          
          git reset --hard
          git pull origin main

          sed -i "s|DOCKERHUB_USERNAME/my-app:latest|${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }}|g" ./k8s/*.*ml || true
          
          kubectl apply -f ./k8s/
          
          kubectl rollout status deployment/two-tier-app
 
