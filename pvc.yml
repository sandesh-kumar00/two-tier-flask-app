kind: PersistentVolume
apiVersion: v1
metadata:
  name: my-pv

spec:
  capacity:
    storage: 1Gi
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/mnt/data"


---

kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: my-pvc

spec:
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
        
